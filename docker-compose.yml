version: "3.8"
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: recipevault
      POSTGRES_PASSWORD: recipevault
      POSTGRES_DB: recipevault
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recipevault"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
