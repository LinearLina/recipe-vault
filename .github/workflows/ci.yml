name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  api-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: recipevault
          POSTGRES_PASSWORD: recipevault
          POSTGRES_DB: recipevault
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U recipevault"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://recipevault:recipevault@localhost:5432/recipevault
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package.json
      - name: Install server deps
        working-directory: server
        run: npm install
      - name: Run migrations
        working-directory: server
        run: npm run migrate
      - name: Run API tests
        working-directory: server
        run: npm test

  client-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package.json
      - name: Install client deps
        working-directory: client
        run: npm install
      - name: Build client
        working-directory: client
        run: npm run build
