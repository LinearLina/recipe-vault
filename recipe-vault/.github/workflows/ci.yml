name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  # Throwaway credentials for the short-lived CI database container only.
  SA_PASSWORD: Ci_Test_Pass123

jobs:
  backend:
    name: Backend (build, format, unit + integration tests)
    runs-on: ubuntu-latest
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: Ci_Test_Pass123
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P Ci_Test_Pass123 -C -Q 'SELECT 1' || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 20s
    env:
      RECIPEVAULT_TEST_DB: "Server=localhost,1433;Database=RecipeVault_Tests;User Id=sa;Password=Ci_Test_Pass123;TrustServerCertificate=True"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: backend/global.json
      - name: Restore
        run: dotnet restore
      - name: Check formatting
        run: dotnet format whitespace --verify-no-changes
      - name: Build (warnings are errors)
        run: dotnet build --no-restore -c Release
      - name: Check migrations are up to date with the model
        run: |
          dotnet tool restore
          dotnet ef migrations has-pending-model-changes --project src/RecipeVault.Infrastructure --startup-project src/RecipeVault.Api --no-build --configuration Release
        env:
          ConnectionStrings__Default: "Server=unused;Database=unused"
          Jwt__Secret: "ci-only-secret-for-design-time-tools-0123456789"
      - name: Test
        run: dotnet test --no-build -c Release --collect:"XPlat Code Coverage" --results-directory ./TestResults
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: backend/TestResults/**/coverage.cobertura.xml

  client-build:
    name: Client build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Install client deps
        working-directory: client
        run: npm ci
      - name: Build client
        working-directory: client
        run: npm run build

  e2e:
    name: End-to-end (Playwright)
    needs: [backend, client-build]
    runs-on: ubuntu-latest
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: Ci_Test_Pass123
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P Ci_Test_Pass123 -C -Q 'SELECT 1' || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 20s
    env:
      ConnectionStrings__Default: "Server=localhost,1433;Database=RecipeVault_E2E;User Id=sa;Password=Ci_Test_Pass123;TrustServerCertificate=True"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: backend/global.json
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Create database and load sample data
        working-directory: backend
        run: dotnet run --project src/RecipeVault.Api --no-launch-profile -- --migrate --seed
        env:
          ASPNETCORE_ENVIRONMENT: Development
      - name: Install client and Playwright
        run: |
          npm ci --prefix client
          npm ci --prefix e2e
          cd e2e && npx playwright install --with-deps chromium
      - name: Run E2E tests
        working-directory: e2e
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report
